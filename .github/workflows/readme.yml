name: Update README

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  readme:
    runs-on: ubuntu-latest
    # Cargo Assist also commits to this branch. Serialize both writers.
    concurrency:
      group: branch-maintenance-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # A queued run must generate docs from the current branch head.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Run doc2readme
        uses: docker://codeberg.org/msrd0/cargo-doc2readme:nightly
        with:
          entrypoint: cargo
          args: doc2readme --expand-macros
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Generate supported-device documentation
        run: python scripts/docs/gen_supported_devices.py
      - name: Commit updated README/docs
        env:
          DOCS_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/supported-devices.md
          if git diff --cached --quiet; then
            echo "Generated documentation is already up to date."
            exit 0
          fi
          # An external push can still change generation inputs. Rerun instead
          # of rebasing stale generated output onto different source code.
          git fetch origin "refs/heads/$DOCS_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::Branch changed during documentation generation; rerun this workflow."
            exit 1
          fi
          git commit -m "docs: update README"
          git push origin "HEAD:refs/heads/$DOCS_BRANCH"
